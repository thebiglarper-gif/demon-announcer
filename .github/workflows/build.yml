name: Build Geode Mod

# Builds two versions of the mod from the same code:
#   v1.x  -> Geometry Dash 2.2081 (stable Geode v5)
#   v2.x  -> Geometry Dash 2.2091 and newer (Geode v6)
on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  gd-2-2081:
    name: GD 2.2081 (Geode v5)
    runs-on: windows-2022  # windows-latest (VS 18) breaks Geode builds right now
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - uses: actions/upload-artifact@v4
        with:
          name: Demon Announcer for GD 2.2081
          path: ${{ steps.build.outputs.build-output }}

  gd-2-2091:
    name: GD 2.2091 (Geode v6)
    runs-on: windows-2022  # windows-latest (VS 18) breaks Geode builds right now
    steps:
      - uses: actions/checkout@v4

      - name: Switch mod.json to GD 2.2091 / Geode v6
        shell: pwsh
        run: |
          $mod = Get-Content mod.json -Raw | ConvertFrom-Json
          $mod.geode = "6.0.0-alpha.2"
          $mod.gd.win = "2.2091"
          $mod.version = "v2.0.0"
          $mod | ConvertTo-Json -Depth 10 | Set-Content mod.json -Encoding utf8
          Get-Content mod.json

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - uses: actions/upload-artifact@v4
        with:
          name: Demon Announcer for GD 2.2091
          path: ${{ steps.build.outputs.build-output }}

  # Puts both builds on a public release page with permanent download links (no GitHub login needed):
  #   .../releases/download/builds/demon-announcer-gd2.2081.geode
  #   .../releases/download/builds/demon-announcer-gd2.2091.geode
  publish:
    name: Publish downloads
    needs: [gd-2-2081, gd-2-2091]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Name the files
        run: |
          mkdir dl
          cp "out/Demon Announcer for GD 2.2081/"*.geode dl/demon-announcer-gd2.2081.geode
          cp "out/Demon Announcer for GD 2.2091/"*.geode dl/demon-announcer-gd2.2091.geode
          ls -la dl

      - name: Update the downloads release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view builds > /dev/null 2>&1 || gh release create builds --latest \
            --title "Demon Announcer downloads" \
            --notes "Always the newest build. demon-announcer-gd2.2081.geode is for Geometry Dash 2.2081 (Geode v5). demon-announcer-gd2.2091.geode is for Geometry Dash 2.2091 (Geode v6, still in testing)."
          gh release upload builds dl/*.geode --clobber
